<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShiftLog">
<title>ShiftLog</title>
<style>
:root{
  --teal:#1D9E75;--teal-bg:#E1F5EE;--teal-tx:#0F6E56;
  --blue:#378ADD;--blue-bg:#E6F1FB;--blue-tx:#185FA5;
  --purp:#534AB7;--purp-bg:#EEEDFE;--purp-tx:#3C3489;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-tx:#A32D2D;
  --amber:#EF9F27;--amber-bg:#FAEEDA;--amber-tx:#854F0B;
  --pink:#D4537E;--pink-bg:#FBEAF0;--pink-tx:#993556;
  --coral:#D85A30;--coral-bg:#FAECE7;--coral-tx:#993C1D;
  --g50:#F5F4F0;--g100:#E8E7E3;--g200:#D3D1C7;--g400:#888780;--g600:#5F5E5A;
  --bg:#fff;--bg2:#F5F4F0;--tx:#1a1a1a;--tx2:#5F5E5A;--tx3:#888780;--bdr:#E8E7E3;
  --r:10px;--rl:14px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#2C2C2A;--tx:#F5F4F0;--tx2:#B4B2A9;--tx3:#888780;--bdr:#444441;
    --teal:#5DCAA5;--teal-bg:#085041;--teal-tx:#9FE1CB;
    --blue:#85B7EB;--blue-bg:#042C53;--blue-tx:#B5D4F4;
    --purp:#AFA9EC;--purp-bg:#26215C;--purp-tx:#CECBF6;
    --red:#F09595;--red-bg:#501313;--red-tx:#F7C1C1;
    --amber:#FAC775;--amber-bg:#412402;--amber-tx:#EF9F27;
    --pink:#ED93B1;--pink-bg:#4B1528;--pink-tx:#F4C0D1;
    --coral:#F0997B;--coral-bg:#4A1B0C;--coral-tx:#F5C4B3;
    --g50:#2C2C2A;--g100:#444441;--g200:#5F5E5A;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sat)}

.hdr{padding:16px 20px 12px;background:var(--bg);border-bottom:0.5px solid var(--bdr);flex-shrink:0}
.hdr h1{font-size:20px;font-weight:600;letter-spacing:-0.3px}
.hdr p{font-size:12px;color:var(--tx3);margin-top:2px}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 110px}

.tbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:0.5px solid var(--bdr);padding:6px 0 calc(6px + var(--sab));z-index:50}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;padding:6px 2px;font-size:9px;color:var(--tx3)}
.tbtn.act{color:var(--teal)}
.tbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn.act svg{stroke-width:2.2}

.mnav{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 12px}
.mnav button{background:none;border:0.5px solid var(--bdr);border-radius:var(--r);width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--tx);display:flex;align-items:center;justify-content:center}
.mnav button:active{background:var(--bg2);transform:scale(.96)}
.mlbl{font-size:16px;font-weight:600}

.leg{display:flex;gap:8px;justify-content:center;padding-bottom:12px;font-size:10px;color:var(--tx2);flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:4px}
.leg .pp{width:7px;height:7px;border-radius:50%}

.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ch{font-size:11px;font-weight:600;color:var(--tx3);text-align:center;padding:6px 0}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r);cursor:pointer;font-size:13px;position:relative;border:1.5px solid transparent;transition:all .12s}
.cd:active{transform:scale(.92)}
.cd.today{border-color:var(--teal)}
.cd.sel{background:var(--teal-bg);border-color:var(--teal)}
.cd.hd .dn{font-weight:700}
.cd.em{cursor:default;pointer-events:none}
.cd.tOFF{background:var(--g50)}.cd.tOFF .dn{color:var(--tx3);text-decoration:line-through}
.cd.tLV{background:var(--amber-bg)}.cd.tSW{background:var(--pink-bg)}
.cd.tSL{background:var(--coral-bg)}
.cd.haslog::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.dots{display:flex;gap:2px;position:absolute;bottom:4px}
.dt{width:5px;height:5px;border-radius:50%}

/* Modal */
.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.mdl{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px calc(20px + var(--sab));animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:36px;height:4px;border-radius:2px;background:var(--g200);margin:0 auto 16px}
.mt{font-size:17px;font-weight:600;margin-bottom:4px}
.ms{font-size:13px;color:var(--tx3);margin-bottom:16px}
.msl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px}
.msl:first-of-type{margin-top:0}

.mo{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--bdr);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .12s}
.mo:active{transform:scale(.98)}
.mo.on-AM,.mo.on-PM,.mo.on-NT{border-color:var(--teal);background:var(--teal-bg)}
.mo.on-OFF{border-color:var(--g400);background:var(--g50)}
.mo.on-LV{border-color:var(--amber);background:var(--amber-bg)}
.mo.on-SL{border-color:var(--coral);background:var(--coral-bg)}
.mo.on-SW{border-color:var(--pink);background:var(--pink-bg)}
.mo.lk{opacity:0.3;pointer-events:none}
.mp{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.mpsq{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.mi{flex:1}.mn{font-size:14px;font-weight:500}.mtm{font-size:12px;color:var(--tx2);margin-top:1px}
.mc{width:22px;height:22px;border-radius:50%;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;transition:all .12s}
.mo.on-AM .mc,.mo.on-PM .mc,.mo.on-NT .mc{border-color:var(--teal);background:var(--teal);color:#fff}
.mo.on-OFF .mc{border-color:var(--g400);background:var(--g400);color:#fff}
.mo.on-LV .mc{border-color:var(--amber);background:var(--amber);color:#fff}
.mo.on-SL .mc{border-color:var(--coral);background:var(--coral);color:#fff}
.mo.on-SW .mc{border-color:var(--pink);background:var(--pink);color:#fff}

.mbtns{display:flex;gap:10px;margin-top:16px}
.mb-clr{flex:1;padding:14px;border:1px dashed var(--bdr);border-radius:var(--r);background:none;color:var(--red);font-size:14px;font-weight:500;cursor:pointer}
.mb-clr:active{background:var(--red-bg)}
.mb-done{flex:1;padding:14px;border:none;border-radius:var(--r);background:var(--teal);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.mb-done:active{transform:scale(.98);opacity:.9}

/* Time log in modal */
.log-section{margin-top:8px;border-top:0.5px solid var(--bdr);padding-top:12px}
.log-entry{display:flex;align-items:center;gap:8px;padding:10px 12px;border:0.5px solid var(--bdr);border-radius:var(--r);margin-bottom:6px;font-size:13px}
.log-entry .lbdg{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;white-space:nowrap}
.log-entry .ltimes{flex:1;color:var(--tx2);font-variant-numeric:tabular-nums}
.log-entry .lhrs{font-size:11px;font-weight:600;color:var(--tx2)}
.log-entry .ledit{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-weight:500;padding:4px 8px}
.log-entry .ledit:active{opacity:.7}
.log-entry .ldel{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.log-entry .ldel:active{background:var(--red-bg)}
.add-log-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:1.5px dashed var(--bdr);border-radius:var(--r);background:none;color:var(--teal);font-size:13px;font-weight:500;cursor:pointer;margin-top:4px}
.add-log-btn:active{background:var(--teal-bg)}
.add-log-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* Log edit form */
.sw-back{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:16px;font-size:14px;font-weight:500}
.sw-back:active{opacity:.7}
.sw-back svg{width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back-pink{color:var(--pink)}.back-pink svg{stroke:var(--pink)}
.back-blue{color:var(--blue)}.back-blue svg{stroke:var(--blue)}
.flbl{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;display:block}
.finp{width:100%;padding:12px 14px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:14px;background:var(--bg);color:var(--tx);margin-bottom:16px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.finp:focus{border-color:var(--teal)}
.finp::placeholder{color:var(--tx3)}
textarea.finp{min-height:80px;resize:vertical}
.frow{display:flex;gap:10px;margin-bottom:16px}
.frow .finp{margin-bottom:0;flex:1}
.shift-pills{display:flex;gap:8px;margin-bottom:16px}
.spill{flex:1;padding:12px 8px;border:1.5px solid var(--bdr);border-radius:var(--r);text-align:center;cursor:pointer;font-size:13px;font-weight:500;transition:all .12s;background:var(--bg)}
.spill:active{transform:scale(.97)}
.spill.s-AM{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-tx)}
.spill.s-PM{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-tx)}
.spill.s-NT{border-color:var(--purp);background:var(--purp-bg);color:var(--purp-tx)}
.sw-info{background:var(--pink-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--pink-tx)}
.log-form-info{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--blue-tx)}

/* Clock */
.ccard{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rl);padding:32px 20px 28px;text-align:center;margin:16px 0}
.ctime{font-size:48px;font-weight:300;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.cdate{font-size:13px;color:var(--tx2);margin-bottom:24px}
.cscheds{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.cstat{display:inline-block;padding:5px 16px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:24px;letter-spacing:0.3px}
.s-out{background:var(--g50);color:var(--tx3)}
.s-in{background:var(--teal-bg);color:var(--teal-tx)}
.s-lv{background:var(--amber-bg);color:var(--amber-tx)}
.s-sl{background:var(--coral-bg);color:var(--coral-tx)}
.cbtn{width:130px;height:130px;border-radius:50%;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .15s}
.cbtn:active{transform:scale(.92)}
.cb-in{background:var(--teal);color:#fff;box-shadow:0 4px 20px rgba(29,158,117,0.3)}
.cb-out{background:var(--red);color:#fff;box-shadow:0 4px 20px rgba(226,75,74,0.25)}
.cb-dis{background:var(--g200);color:var(--tx3);cursor:not-allowed;box-shadow:none}
.cb-dis:active{transform:none}
.csince{margin-top:16px;font-size:12px;color:var(--tx3)}
.tlhdr{font-size:13px;font-weight:600;color:var(--tx2);margin:20px 0 10px;padding:0 4px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0.5px solid var(--bdr);border-radius:var(--r);margin-bottom:6px}
.lbdg2{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:600;white-space:nowrap}
.ltm2{flex:1;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.lhr2{font-size:12px;font-weight:600;color:var(--tx2)}
.ldel2{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px}
.ldel2:active{background:var(--red-bg)}
.empty{text-align:center;padding:40px 16px;color:var(--tx3);font-size:13px}
.dom{text-align:center;padding:20px;color:var(--tx3);font-size:14px;margin:10px 0;border:1px dashed var(--bdr);border-radius:var(--r)}

/* Shared */
.rb{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}

/* Patients tab */
.add-pat-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1.5px dashed var(--blue);border-radius:var(--r);background:none;color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;margin:16px 0}
.add-pat-btn:active{background:var(--blue-bg)}
.add-pat-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.pat-card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rl);padding:16px;margin-bottom:10px}
.pat-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pat-card-name{font-size:15px;font-weight:600;flex:1}
.pat-card-actions{display:flex;gap:4px}
.pat-edit{background:none;border:none;color:var(--blue);font-size:12px;font-weight:500;cursor:pointer;padding:4px 8px;border-radius:6px}
.pat-edit:active{background:var(--blue-bg)}
.pat-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px}
.pat-del:active{background:var(--red-bg)}
.pat-field{display:flex;gap:8px;padding:6px 0;border-top:0.5px solid var(--bdr);font-size:13px}
.pat-field:first-of-type{border-top:none}
.pat-label{color:var(--tx3);width:80px;flex-shrink:0;font-weight:500}
.pat-value{color:var(--tx);flex:1}
.pat-summary{text-align:center;font-size:12px;color:var(--tx3);padding:12px 0;margin-top:8px}
.pat-datepick{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pat-dateinp{font-size:14px;padding:10px 12px}
.pat-today-btn{padding:10px 16px;border:1.5px solid var(--teal);border-radius:var(--r);background:none;color:var(--teal);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pat-today-btn:active{background:var(--teal-bg)}
.pat-card-num{width:26px;height:26px;border-radius:50%;background:var(--blue-bg);color:var(--blue-tx);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}

/* Checklist */
.checklist{margin-bottom:16px}
.chk-row{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1.5px solid var(--bdr);border-radius:var(--r);margin-bottom:6px;cursor:pointer;transition:all .12s}
.chk-row:active{transform:scale(.98)}
.chk-row.chk-on{border-color:var(--teal);background:var(--teal-bg)}
.chk-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;transition:all .12s}
.chk-row.chk-on .chk-box{border-color:var(--teal);background:var(--teal);color:#fff}
.chk-label{font-size:13px;line-height:1.4;padding-top:1px}
.chk-no-tag{display:inline-block;background:var(--red-bg);color:var(--red-tx);font-size:11px;padding:2px 8px;border-radius:10px;margin:1px 2px}

/* Charge nurse tab */
.ch-card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rl);padding:16px;margin-bottom:16px}
.ch-card-title{font-size:15px;font-weight:600;margin-bottom:16px}
.ch-field{margin-bottom:14px}
.ch-flbl{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.3px}
.ch-inp{margin-bottom:0;font-size:15px}
.ch-num-row{display:flex;gap:0;align-items:center}
.ch-num{text-align:center;border-radius:0;border-left:none;border-right:none;flex:1;font-weight:600;font-size:18px;padding:12px 8px}
.ch-minus,.ch-plus{width:48px;height:48px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--tx);font-size:22px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.ch-minus{border-radius:var(--r) 0 0 var(--r)}
.ch-plus{border-radius:0 var(--r) var(--r) 0}
.ch-minus:active,.ch-plus:active{background:var(--bdr);transform:scale(.95)}
.ch-clear{display:block;width:100%;padding:10px;text-align:center;font-size:13px;color:var(--red);background:none;border:1px dashed var(--bdr);border-radius:var(--r);cursor:pointer;margin-top:8px}
.ch-clear:active{background:var(--red-bg)}
textarea.ch-inp{min-height:70px;resize:vertical}

/* Reports tab */
.rpt-month{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 16px}
.rpt-month button{background:none;border:0.5px solid var(--bdr);border-radius:var(--r);width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--tx);display:flex;align-items:center;justify-content:center}
.rpt-month button:active{background:var(--bg2);transform:scale(.96)}
.rpt-section{margin-bottom:24px}
.rpt-title{font-size:15px;font-weight:600;margin-bottom:4px}
.rpt-desc{font-size:12px;color:var(--tx3);margin-bottom:12px}
.rpt-card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rl);padding:16px;margin-bottom:10px}
.rpt-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--bdr);font-size:13px}
.rpt-row:last-child{border-bottom:none}
.rpt-row-label{flex:1;color:var(--tx2)}
.rpt-row-val{font-weight:600;min-width:50px;text-align:right}
.rpt-total{background:var(--teal-bg);color:var(--teal-tx);font-weight:600}
.rpt-total .rpt-row-label{color:var(--teal-tx)}
.xbtn{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;margin-bottom:8px}
.xbtn:active{transform:scale(.98);opacity:.9}
.rpt-stat{display:flex;gap:8px;margin-bottom:12px}
.rpt-stat-item{flex:1;background:var(--bg2);border-radius:var(--r);padding:12px}
.rpt-stat-label{font-size:11px;color:var(--tx3);margin-bottom:2px}
.rpt-stat-val{font-size:22px;font-weight:600}
.rpt-check-row{display:flex;align-items:flex-start;gap:6px;padding:6px 0;font-size:13px}
.rpt-check-num{min-width:36px;font-weight:600;text-align:right;color:var(--teal-tx)}
.rpt-check-txt{flex:1;color:var(--tx2)}
</style>
</head>
<body>

<div class="hdr"><h1>ShiftLog</h1><p>Camarines Norte Provincial Hospital</p></div>
<div class="main" id="main"></div>
<div class="tbar" id="tabs"></div>
<div class="ov" id="ov" onclick="closeBg(event)"><div class="mdl" id="mdl"></div></div>

<script>
var SHIFTS=[
  {id:"AM",name:"Morning",label:"6:00 AM – 2:00 PM",short:"6A–2P",hex:"#1D9E75",color:"var(--teal)",bg:"var(--teal-bg)",tx:"var(--teal-tx)"},
  {id:"PM",name:"Afternoon",label:"2:00 PM – 10:00 PM",short:"2P–10P",hex:"#378ADD",color:"var(--blue)",bg:"var(--blue-bg)",tx:"var(--blue-tx)"},
  {id:"NT",name:"Night",label:"10:00 PM – 6:00 AM",short:"10P–6A",hex:"#534AB7",color:"var(--purp)",bg:"var(--purp-bg)",tx:"var(--purp-tx)"}
];
var TAGS=[
  {id:"OFF",name:"Day off",short:"Day off",hex:"#888780",color:"var(--g400)",bg:"var(--g50)",tx:"var(--g600)"},
  {id:"LV",name:"Vacation leave",short:"VL",hex:"#EF9F27",color:"var(--amber)",bg:"var(--amber-bg)",tx:"var(--amber-tx)"},
  {id:"SL",name:"Sick leave",short:"SL",hex:"#D85A30",color:"var(--coral)",bg:"var(--coral-bg)",tx:"var(--coral-tx)"},
  {id:"SW",name:"Shift swap",short:"Shift swap",hex:"#D4537E",color:"var(--pink)",bg:"var(--pink-bg)",tx:"var(--pink-tx)"}
];
var ALL=SHIFTS.concat(TAGS);
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var ORDER=["AM","PM","NT","OFF","LV","SL","SW"];

function gi(id){for(var i=0;i<ALL.length;i++){if(ALL[i].id===id)return ALL[i];}return null;}
function isT(id){return id==="OFF"||id==="LV"||id==="SL"||id==="SW";}
function isS(id){return id==="AM"||id==="PM"||id==="NT";}
function fd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function ft(iso){if(!iso)return"--:--";return new Date(iso).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:true});}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function fdom(y,m){return new Date(y,m,1).getDay();}
function dsh(iso){var h=new Date(iso).getHours();if(h>=5&&h<10)return"AM";if(h>=10&&h<18)return"PM";return"NT";}
function srt(a){return a.slice().sort(function(x,y){return ORDER.indexOf(x)-ORDER.indexOf(y);});}

var K="cnph-v8";
var S={tab:"schedule",vy:new Date().getFullYear(),vm:new Date().getMonth(),sel:fd(new Date()),scheds:{},logs:{},cin:null,swaps:{},patients:{},charge:{}};
var modalDate="";
var swapDraft={nurse:"",date:"",shift:"",notes:""};
var logDraft={login:"",logout:"",shift:"",editIdx:-1};

function save(){try{localStorage.setItem(K,JSON.stringify({s:S.scheds,l:S.logs,c:S.cin,sw:S.swaps,p:S.patients,ch:S.charge}));}catch(e){}}
function load(){try{var r=localStorage.getItem(K);if(r){var d=JSON.parse(r);S.scheds=d.s||{};S.logs=d.l||{};S.cin=d.c||null;S.swaps=d.sw||{};S.patients=d.p||{};S.charge=d.ch||{};}}catch(e){}}

function gdd(date){
  var raw=S.scheds[date]||[];
  var sh=[],tg=[];
  for(var i=0;i<raw.length;i++){if(isS(raw[i]))sh.push(raw[i]);else if(isT(raw[i]))tg.push(raw[i]);}
  return{shifts:sh,tags:tg,all:raw};
}

function stab(t){S.tab=t;render();}
function pm(){S.vm--;if(S.vm<0){S.vm=11;S.vy--;}render();}
function nm(){S.vm++;if(S.vm>11){S.vm=0;S.vy++;}render();}
function selDay(d){S.sel=d;modalDate=d;render();openMain(d);}

function toggleItem(date,itemId){
  if(itemId==="SW"){openSwapForm(date);return;}
  var cur=(S.scheds[date]||[]).slice();
  if(isT(itemId)){
    var has=cur.indexOf(itemId)>=0;
    if(has){cur.splice(cur.indexOf(itemId),1);}
    else{if(itemId==="OFF"){cur=["OFF"];delete S.swaps[date];}else{cur=cur.filter(function(id){return id!=="OFF";});cur.push(itemId);}}
  }else{
    if(cur.indexOf("OFF")>=0)return;
    var idx=cur.indexOf(itemId);if(idx>=0)cur.splice(idx,1);else cur.push(itemId);
  }
  cur=srt(cur);
  if(cur.length===0)delete S.scheds[date];else S.scheds[date]=cur;
  save();renderMainModal(date);render();
}

function clearDay(date){
  var dd=gdd(date);var logs=S.logs[date]||[];
  var msg="Are you sure you want to clear this day?";
  if(logs.length>0)msg+="\n\nThis will remove the schedule and swap info.\nTime log entries ("+logs.length+" record"+(logs.length>1?"s":"")+") will be kept.";
  if(!confirm(msg))return;
  delete S.scheds[date];delete S.swaps[date];save();closeM();render();
}
function removeSwap(date){
  if(!confirm("Remove this shift swap?"))return;
  var cur=(S.scheds[date]||[]).slice();var idx=cur.indexOf("SW");if(idx>=0)cur.splice(idx,1);
  if(cur.length===0)delete S.scheds[date];else S.scheds[date]=cur;
  delete S.swaps[date];save();renderMainModal(date);render();
}

/* MODAL */
function openM(){document.getElementById("ov").className="ov open";}
function closeM(){document.getElementById("ov").className="ov";}
function closeBg(e){if(e.target===document.getElementById("ov"))closeM();}

function openMain(date){modalDate=date;openM();renderMainModal(date);}

function renderMainModal(date){
  var dd=gdd(date);var dobj=pd(date);
  var hasDO=dd.tags.indexOf("OFF")>=0;
  var hasSW=dd.tags.indexOf("SW")>=0;
  var swap=S.swaps[date];
  var logs=S.logs[date]||[];

  var h='<div class="mh"></div>';
  h+='<div class="mt">'+dobj.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+'</div>';
  h+='<div class="ms">'+(hasDO?"Marked as day off — clear to assign shifts":"Tap to assign shifts (multiple = double shift)")+'</div>';

  h+='<div class="msl">Shifts</div>';
  for(var i=0;i<SHIFTS.length;i++){
    var s=SHIFTS[i],on=dd.shifts.indexOf(s.id)>=0;
    h+='<div class="mo'+(on?" on-"+s.id:"")+(hasDO?" lk":"")+'" onclick="toggleItem(\''+date+"','"+s.id+"')\">";
    h+='<span class="mp" style="background:'+s.color+'"></span>';
    h+='<div class="mi"><div class="mn">'+s.name+'</div><div class="mtm">'+s.label+'</div></div>';
    h+='<span class="mc">'+(on?"&#10003;":"")+'</span></div>';
  }

  h+='<div class="msl">Status</div>';
  for(var i=0;i<TAGS.length;i++){
    var t=TAGS[i],on=dd.tags.indexOf(t.id)>=0;
    if(t.id==="SW"&&hasDO)continue;
    h+='<div class="mo'+(on?" on-"+t.id:"")+'" onclick="toggleItem(\''+date+"','"+t.id+"')\">";
    h+='<span class="mpsq" style="background:'+t.color+'"></span>';
    h+='<div class="mi"><div class="mn">'+t.name+'</div></div>';
    h+='<span class="mc">'+(on?"&#10003;":"")+'</span></div>';
  }

  if(hasSW&&swap){
    var swSh=gi(swap.shift);
    h+='<div class="sw-info"><strong>Swap details:</strong><br>With: '+swap.nurse+'<br>New schedule: '+swap.date+(swSh?" ("+swSh.short+")":"")+'<br>';
    if(swap.notes)h+='Notes: '+swap.notes;
    h+='</div>';
    h+='<div style="display:flex;gap:8px;margin-bottom:8px">';
    h+='<button style="flex:1;padding:10px;border:1.5px solid var(--pink);border-radius:var(--r);background:none;color:var(--pink);font-size:13px;font-weight:500;cursor:pointer" onclick="openSwapForm(\''+date+'\')">Edit swap</button>';
    h+='<button style="flex:1;padding:10px;border:1px dashed var(--bdr);border-radius:var(--r);background:none;color:var(--red);font-size:13px;font-weight:500;cursor:pointer" onclick="removeSwap(\''+date+'\')">Remove swap</button>';
    h+='</div>';
  }

  /* TIME LOG SECTION */
  h+='<div class="log-section">';
  h+='<div class="msl">Time log</div>';
  if(logs.length>0){
    for(var i=0;i<logs.length;i++){
      var l=logs[i],s=gi(l.sh),iT=new Date(l.lt),oT=l.lo?new Date(l.lo):null;
      var hrs=oT?((oT-iT)/3600000).toFixed(1)+"h":"";
      h+='<div class="log-entry">';
      h+='<span class="lbdg" style="background:'+(s?s.bg:"var(--g50)")+";color:"+(s?s.tx:"var(--tx2)")+'">'+(s?s.short:"--")+'</span>';
      h+='<span class="ltimes">'+ft(l.lt)+" → "+(l.lo?ft(l.lo):"...")+'</span>';
      if(hrs)h+='<span class="lhrs">'+hrs+'</span>';
      h+='<button class="ledit" onclick="openLogForm(\''+date+'\','+i+')">Edit</button>';
      h+='<button class="ldel" onclick="delLogModal(\''+date+'\','+i+')">&times;</button>';
      h+='</div>';
    }
  }else{
    h+='<div style="font-size:12px;color:var(--tx3);padding:8px 0">No time entries for this day.</div>';
  }
  h+='<button class="add-log-btn" onclick="openLogForm(\''+date+'\',-1)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add time entry</button>';
  h+='</div>';

  h+='<div class="mbtns">';
  if(dd.all.length>0)h+='<button class="mb-clr" onclick="clearDay(\''+date+'\')">Clear day</button>';
  h+='<button class="mb-done" onclick="closeM()">Done</button>';
  h+='</div>';

  document.getElementById("mdl").innerHTML=h;
}

function delLogModal(date,idx){
  if(!confirm("Delete this time log entry?"))return;
  var l=S.logs[date];if(!l)return;l.splice(idx,1);
  if(l.length===0)delete S.logs[date];
  save();renderMainModal(date);render();
}

/* LOG ADD/EDIT FORM */
function openLogForm(date,idx){
  modalDate=date;
  logDraft.editIdx=idx;
  if(idx>=0){
    var l=S.logs[date][idx];
    var iT=new Date(l.lt);
    var oT=l.lo?new Date(l.lo):null;
    logDraft.login=String(iT.getHours()).padStart(2,"0")+":"+String(iT.getMinutes()).padStart(2,"0");
    logDraft.logout=oT?(String(oT.getHours()).padStart(2,"0")+":"+String(oT.getMinutes()).padStart(2,"0")):"";
    logDraft.shift=l.sh||"";
  }else{
    logDraft.login="";
    logDraft.logout="";
    logDraft.shift="";
  }
  renderLogForm(date);
}

function renderLogForm(date){
  var dobj=pd(date);
  var isEdit=logDraft.editIdx>=0;

  var h='<div class="mh"></div>';
  h+='<div class="sw-back back-blue" onclick="openMain(\''+date+'\')">';
  h+='<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</div>';
  h+='<div class="mt">'+(isEdit?"Edit time entry":"Add time entry")+'</div>';
  h+='<div class="ms">'+dobj.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+'</div>';

  if(!isEdit){
    h+='<div class="log-form-info">Use this to manually log a shift you forgot to punch in or out for.</div>';
  }

  h+='<label class="flbl">Login time</label>';
  h+='<input class="finp" type="time" id="log-in" value="'+logDraft.login+'" oninput="logDraft.login=this.value">';

  h+='<label class="flbl">Logout time</label>';
  h+='<input class="finp" type="time" id="log-out" value="'+logDraft.logout+'" oninput="logDraft.logout=this.value">';

  h+='<label class="flbl">Shift</label>';
  h+='<div class="shift-pills">';
  for(var i=0;i<SHIFTS.length;i++){
    var s=SHIFTS[i],sel=logDraft.shift===s.id;
    h+='<div class="spill'+(sel?" s-"+s.id:"")+'" onclick="pickLogShift(\''+s.id+'\',\''+date+'\')">'+s.short+'</div>';
  }
  h+='</div>';

  h+='<div class="mbtns">';
  h+='<button class="mb-clr" onclick="openMain(\''+date+'\')">Cancel</button>';
  h+='<button class="mb-done" onclick="saveLog(\''+date+'\')">'+(isEdit?"Save changes":"Add entry")+'</button>';
  h+='</div>';

  document.getElementById("mdl").innerHTML=h;
}

function pickLogShift(shiftId,date){
  logDraft.shift=shiftId;
  renderLogForm(date);
}

function saveLog(date){
  var loginVal=document.getElementById("log-in").value;
  var logoutVal=document.getElementById("log-out").value;

  if(!loginVal){alert("Please enter a login time.");return;}

  var dp=date.split("-");
  var yr=+dp[0],mo=+dp[1]-1,dy=+dp[2];
  var lp=loginVal.split(":");
  var loginDt=new Date(yr,mo,dy,+lp[0],+lp[1]);
  var logoutDt=null;
  if(logoutVal){
    var op=logoutVal.split(":");
    logoutDt=new Date(yr,mo,dy,+op[0],+op[1]);
    if(logoutDt<=loginDt){
      logoutDt=new Date(yr,mo,dy+1,+op[0],+op[1]);
    }
  }

  var shift=logDraft.shift;
  if(!shift){
    var h=loginDt.getHours();
    if(h>=5&&h<10)shift="AM";else if(h>=10&&h<18)shift="PM";else shift="NT";
  }

  var entry={lt:loginDt.toISOString(),lo:logoutDt?logoutDt.toISOString():null,sh:shift};

  if(!S.logs[date])S.logs[date]=[];

  if(logDraft.editIdx>=0){
    S.logs[date][logDraft.editIdx]=entry;
  }else{
    S.logs[date].push(entry);
  }

  S.logs[date].sort(function(a,b){return new Date(a.lt)-new Date(b.lt);});

  save();
  openMain(date);
  render();
}

/* SWAP FORM */
function openSwapForm(date){
  modalDate=date;
  var existing=S.swaps[date];
  if(existing){swapDraft={nurse:existing.nurse||"",date:existing.date||"",shift:existing.shift||"",notes:existing.notes||""};}
  else{swapDraft={nurse:"",date:"",shift:"",notes:""};}
  openM();renderSwapForm(date);
}

function renderSwapForm(date){
  var dobj=pd(date);
  var h='<div class="mh"></div>';
  h+='<div class="sw-back back-pink" onclick="openMain(\''+date+'\')">';
  h+='<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</div>';
  h+='<div class="mt">Shift swap details</div>';
  h+='<div class="ms">'+dobj.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+'</div>';

  h+='<label class="flbl">Swap schedule with</label>';
  h+='<input class="finp" type="text" id="sw-nurse" placeholder="Name of nurse" value="'+esc(swapDraft.nurse)+'" oninput="swapDraft.nurse=this.value">';
  h+='<label class="flbl">New schedule date</label>';
  h+='<input class="finp" type="date" id="sw-date" value="'+swapDraft.date+'" oninput="swapDraft.date=this.value">';
  h+='<label class="flbl">New schedule shift</label>';
  h+='<div class="shift-pills">';
  for(var i=0;i<SHIFTS.length;i++){var s=SHIFTS[i],sel=swapDraft.shift===s.id;h+='<div class="spill'+(sel?" s-"+s.id:"")+'" onclick="pickSwapShift(\''+s.id+'\',\''+date+'\')">'+s.short+'</div>';}
  h+='</div>';
  h+='<label class="flbl">Notes</label>';
  h+='<textarea class="finp" id="sw-notes" placeholder="Optional notes" oninput="swapDraft.notes=this.value">'+esc(swapDraft.notes)+'</textarea>';
  h+='<div class="mbtns"><button class="mb-clr" onclick="openMain(\''+date+'\')">Cancel</button>';
  h+='<button class="mb-done" onclick="saveSwap(\''+date+'\')">Save swap</button></div>';
  document.getElementById("mdl").innerHTML=h;
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function pickSwapShift(shiftId,date){swapDraft.shift=shiftId;renderSwapForm(date);}

function saveSwap(date){
  swapDraft.nurse=document.getElementById("sw-nurse").value;
  swapDraft.date=document.getElementById("sw-date").value;
  swapDraft.notes=document.getElementById("sw-notes").value;
  if(!swapDraft.nurse.trim()){alert("Please enter the nurse name.");return;}
  S.swaps[date]={nurse:swapDraft.nurse,date:swapDraft.date,shift:swapDraft.shift,notes:swapDraft.notes};
  var cur=(S.scheds[date]||[]).slice();
  if(cur.indexOf("SW")<0){cur.push("SW");cur=srt(cur);}
  cur=cur.filter(function(id){return id!=="OFF";});
  S.scheds[date]=cur;
  save();openMain(date);render();
}

/* PATIENTS */
var CHECKS=[
  {id:"endorsement",label:"Attended endorsement"},
  {id:"admitted",label:"Admitted patient within the shift"},
  {id:"attended",label:"Attended and assisted patient with his/her needs and rendered immediate nursing intervention"},
  {id:"medications",label:"Administered his/her medications as prescribed by the physician on duty"},
  {id:"orders",label:"Carried out doctor's orders with proper documentation"},
  {id:"documented",label:"Completely documented patient cares done during the shift"},
  {id:"teachings",label:"Provided health teachings to patient and/or watcher"},
  {id:"discharge",label:"Provided complete health instructions of discharged patients"}
];
function defaultChecks(){var o={};for(var i=0;i<CHECKS.length;i++)o[CHECKS[i].id]=true;return o;}

var patDraft={name:"",procedure:"",diagnosis:"",doctor:"",mcod:"",notes:"",checks:null,editIdx:-1};
var patViewDate=fd(new Date());

function openPatientForm(date,idx){
  patViewDate=date;
  if(idx>=0){
    var p=S.patients[date][idx];
    var ch=p.checks?JSON.parse(JSON.stringify(p.checks)):defaultChecks();
    patDraft={name:p.name||"",procedure:p.procedure||"",diagnosis:p.diagnosis||"",doctor:p.doctor||"",mcod:p.mcod||"",notes:p.notes||"",checks:ch,editIdx:idx};
  }else{
    patDraft={name:"",procedure:"",diagnosis:"",doctor:"",mcod:"",notes:"",checks:defaultChecks(),editIdx:-1};
  }
  openM();renderPatientFormModal(date);
}

function renderPatientFormModal(date){
  var dobj=pd(date);
  var isEdit=patDraft.editIdx>=0;
  var h='<div class="mh"></div>';
  h+='<div class="mt">'+(isEdit?"Edit patient record":"New patient record")+'</div>';
  h+='<div class="ms">'+dobj.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+'</div>';

  h+='<label class="flbl">Patient name</label>';
  h+='<input class="finp" type="text" id="pat-name" placeholder="Full name of patient" value="'+esc(patDraft.name)+'" oninput="patDraft.name=this.value">';

  h+='<label class="flbl">Procedure done</label>';
  h+='<input class="finp" type="text" id="pat-proc" placeholder="e.g. IV insertion, wound dressing" value="'+esc(patDraft.procedure)+'" oninput="patDraft.procedure=this.value">';

  h+='<label class="flbl">Final diagnosis</label>';
  h+='<input class="finp" type="text" id="pat-diag" placeholder="e.g. Acute gastroenteritis" value="'+esc(patDraft.diagnosis)+'" oninput="patDraft.diagnosis=this.value">';

  h+='<label class="flbl">Referring doctor</label>';
  h+='<input class="finp" type="text" id="pat-doc" placeholder="Dr. name" value="'+esc(patDraft.doctor)+'" oninput="patDraft.doctor=this.value">';

  h+='<div class="msl">Nursing care checklist</div>';
  h+='<div class="checklist">';
  for(var i=0;i<CHECKS.length;i++){
    var c=CHECKS[i];
    var val=patDraft.checks[c.id]!==false;

  h+='</div>';

  h+='<label class="flbl">MCOD (Medical certificate of death)</label>';
  h+='<input class="finp" type="text" id="pat-mcod" placeholder="Internal medicine doctor\'s name" value="'+esc(patDraft.mcod)+'" oninput="patDraft.mcod=this.value">';

  h+='<label class="flbl">Additional notes</label>';
  h+='<textarea class="finp" id="pat-notes" placeholder="Optional notes" oninput="patDraft.notes=this.value">'+esc(patDraft.notes)+'</textarea>';

  h+='<div class="mbtns">';
  h+='<button class="mb-clr" onclick="closeM()">Cancel</button>';
  h+='<button class="mb-done" onclick="savePatient(\''+date+'\')">'+(isEdit?"Save changes":"Add record")+'</button>';
  h+='</div>';
  document.getElementById("mdl").innerHTML=h;
}

function toggleCheck(checkId,date){
  patDraft.checks[checkId]=!patDraft.checks[checkId];
  renderPatientFormModal(date);
}

function savePatient(date){
  var n=document.getElementById("pat-name").value;
  var pr=document.getElementById("pat-proc").value;
  var dg=document.getElementById("pat-diag").value;
  var dc=document.getElementById("pat-doc").value;
  var mc=document.getElementById("pat-mcod").value;
  var nt=document.getElementById("pat-notes").value;
  if(!n.trim()){alert("Please enter the patient name.");return;}
  var entry={name:n,procedure:pr,diagnosis:dg,doctor:dc,mcod:mc,notes:nt,checks:JSON.parse(JSON.stringify(patDraft.checks)),time:new Date().toISOString()};
  if(!S.patients[date])S.patients[date]=[];
  if(patDraft.editIdx>=0){
    entry.time=S.patients[date][patDraft.editIdx].time||entry.time;
    S.patients[date][patDraft.editIdx]=entry;
  }else{
    S.patients[date].push(entry);
  }
  save();closeM();render();
}

function delPatient(date,idx){
  if(!confirm("Delete this patient record?"))return;
  var p=S.patients[date];if(!p)return;
  p.splice(idx,1);if(p.length===0)delete S.patients[date];
  save();render();
}

/* CLOCK */
function clockIn(){S.cin={lt:new Date().toISOString()};save();render();}
function clockOut(){
  if(!S.cin)return;var t=new Date().toISOString();var day=fd(new Date(S.cin.lt));
  var entry={lt:S.cin.lt,lo:t,sh:dsh(S.cin.lt)};
  if(!S.logs[day])S.logs[day]=[];S.logs[day].push(entry);S.cin=null;save();render();
}
function delLog(date,idx){if(!confirm("Delete this time log entry?"))return;var l=S.logs[date];if(!l)return;l.splice(idx,1);if(l.length===0)delete S.logs[date];save();render();}

/* RENDERERS */
function renderTabs(){

function renderSchedule(){
  var y=S.vy,m=S.vm,tot=dim(y,m),first=fdom(y,m),today=fd(new Date()),sel=S.sel;
  var h='<div class="mnav"><button onclick="pm()">&#8249;</button><span class="mlbl">'+MO[m]+" "+y+'</span><button onclick="nm()">&#8250;</button></div>';
  h+='<div class="leg">';
  for(var i=0;i<SHIFTS.length;i++)h+='<span><span class="pp" style="background:'+SHIFTS[i].hex+'"></span>'+SHIFTS[i].short+'</span>';
  for(var i=0;i<TAGS.length;i++)h+='<span><span class="pp" style="background:'+TAGS[i].hex+'"></span>'+TAGS[i].short+'</span>';
  h+='</div><div class="cgrid">';
  for(var i=0;i<DAYS.length;i++)h+='<div class="ch">'+DAYS[i]+'</div>';
  for(var i=0;i<first;i++)h+='<div class="cd em"></div>';
  for(var d=1;d<=tot;d++){
    var ds2=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var isToday=ds2===today,isSel=ds2===sel,dd=gdd(ds2),hasData=dd.all.length>0;
    var hasLog=!!(S.logs[ds2]&&S.logs[ds2].length>0);
    var tc="";
    if(dd.tags.indexOf("OFF")>=0)tc=" tOFF";else if(dd.tags.indexOf("LV")>=0)tc=" tLV";else if(dd.tags.indexOf("SL")>=0)tc=" tSL";else if(dd.tags.indexOf("SW")>=0)tc=" tSW";
    var dotItems=dd.shifts.length>0?dd.shifts:dd.tags;
    var dots="";
    if(dotItems.length>0){dots='<div class="dots">';for(var j=0;j<dotItems.length;j++){var it=gi(dotItems[j]);if(it)dots+='<span class="dt" style="background:'+it.hex+'"></span>';}dots+='</div>';}
    h+='<div class="cd'+(isToday?" today":"")+(isSel?" sel":"")+(hasData?" hd":"")+tc+(hasLog?" haslog":"")+'" onclick="selDay(\''+ds2+'\')"><span class="dn">'+d+'</span>'+dots+'</div>';
  }
  h+='</div>';return h;
}

function renderClock(){
  var now=new Date(),today=fd(now),isIn=!!S.cin,dd=gdd(today),tl=S.logs[today]||[];
  var isDO=dd.tags.indexOf("OFF")>=0,isLV=dd.tags.indexOf("LV")>=0,isSL=dd.tags.indexOf("SL")>=0;
  var h='<div class="ccard"><div class="ctime" id="lc">'+now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})+'</div>';
  h+='<div class="cdate">'+now.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"})+'</div>';
  if(dd.all.length>0){h+='<div class="cscheds">';for(var i=0;i<dd.all.length;i++){var it=gi(dd.all[i]);if(it)h+='<span class="rb" style="background:'+it.bg+";color:"+it.tx+'">'+it.short+'</span>';}h+='</div>';}
  if(isIn)h+='<div class="cstat s-in">CLOCKED IN</div>';else if(isDO)h+='<div class="cstat s-out">DAY OFF</div>';else if(isLV)h+='<div class="cstat s-lv">VACATION LEAVE</div>';else if(isSL)h+='<div class="cstat s-sl">SICK LEAVE</div>';else h+='<div class="cstat s-out">OFF DUTY</div>';
  h+='<br>';
  if(isIn)h+='<button class="cbtn cb-out" onclick="clockOut()">Clock out</button>';else if(isDO||isLV||isSL)h+='<button class="cbtn cb-dis" disabled>Clock in</button>';else h+='<button class="cbtn cb-in" onclick="clockIn()">Clock in</button>';
  if(isIn)h+='<div class="csince">Since '+ft(S.cin.lt)+'</div>';
  h+='</div><div class="tlhdr">Today\'s log</div>';
  if(tl.length===0&&!isIn){
    if(isDO)h+='<div class="dom">Enjoy your day off!</div>';else if(isLV)h+='<div class="dom">You are on vacation leave today.</div>';else if(isSL)h+='<div class="dom">You are on sick leave today. Get well soon!</div>';else h+='<div class="empty">No time entries today.<br>Tap the button above to clock in.</div>';
  }else{
    for(var i=0;i<tl.length;i++){
      var l=tl[i],s=gi(l.sh),iT=new Date(l.lt),oT=l.lo?new Date(l.lo):null;
      var hrs=oT?((oT-iT)/3600000).toFixed(1)+"h":"";var ld=fd(new Date(l.lt));
      h+='<div class="li"><span class="lbdg2" style="background:'+(s?s.bg:"var(--g50)")+";color:"+(s?s.tx:"var(--tx2)")+'">'+(s?s.short:"--")+'</span>';
      h+='<span class="ltm2">'+ft(l.lt)+" → "+(l.lo?ft(l.lo):"...")+'</span>';
      if(hrs)h+='<span class="lhr2">'+hrs+'</span>';
      h+='<button class="ldel2" onclick="delLog(\''+ld+"',"+i+')">&times;</button></div>';
    }
  }
  return h;
}

function renderPatients(){
  var today=fd(new Date());
  var dobj=pd(patViewDate);
  var isToday=patViewDate===today;

  var h='<div class="mnav"><button onclick="patPrev()">&#8249;</button><span class="mlbl">'+dobj.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric",year:"numeric"})+'</span><button onclick="patNext()">&#8250;</button></div>';

  h+='<div class="pat-datepick">';
  h+='<input class="finp pat-dateinp" type="date" value="'+patViewDate+'" onchange="patJump(this.value)" style="margin-bottom:0;flex:1">';
  if(!isToday)h+='<button class="pat-today-btn" onclick="patJump(\''+today+'\')">Today</button>';
  h+='</div>';

  var records=S.patients[patViewDate]||[];

  h+='<button class="add-pat-btn" onclick="openPatientForm(\''+patViewDate+'\',-1)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add patient record</button>';

  if(records.length===0){
    h+='<div class="empty">No patient records for this day.<br>Tap the button above to add one.</div>';
  }else{
    for(var i=0;i<records.length;i++){
      var p=records[i];
      h+='<div class="pat-card">';
      h+='<div class="pat-card-hdr"><div class="pat-card-num">'+(i+1)+'</div><div class="pat-card-name">'+esc(p.name)+'</div><div class="pat-card-actions">';
      h+='<button class="pat-edit" onclick="openPatientForm(\''+patViewDate+'\','+i+')">Edit</button>';
      h+='<button class="pat-del" onclick="delPatient(\''+patViewDate+'\','+i+')">&times;</button></div></div>';
      if(p.procedure)h+='<div class="pat-field"><span class="pat-label">Procedure</span><span class="pat-value">'+esc(p.procedure)+'</span></div>';
      if(p.diagnosis)h+='<div class="pat-field"><span class="pat-label">Diagnosis</span><span class="pat-value">'+esc(p.diagnosis)+'</span></div>';
      if(p.doctor)h+='<div class="pat-field"><span class="pat-label">Doctor</span><span class="pat-value">'+esc(p.doctor)+'</span></div>';
      if(p.checks){var noCount=0;for(var ci=0;ci<CHECKS.length;ci++){if(p.checks[CHECKS[ci].id]===false)noCount++;}
        if(noCount>0){h+='<div class="pat-field"><span class="pat-label">Checklist</span><span class="pat-value">';
          for(var ci=0;ci<CHECKS.length;ci++){var ck=CHECKS[ci];if(p.checks[ck.id]===false)h+='<span class="chk-no-tag">'+ck.label+'</span> ';}
          h+='</span></div>';}
      }
      if(p.mcod)h+='<div class="pat-field"><span class="pat-label">MCOD</span><span class="pat-value">'+esc(p.mcod)+'</span></div>';
      if(p.notes)h+='<div class="pat-field"><span class="pat-label">Notes</span><span class="pat-value">'+esc(p.notes)+'</span></div>';
      h+='</div>';
    }
  }

  h+='<div class="pat-summary">'+records.length+' patient'+(records.length!==1?'s':'')+' recorded for this day</div>';
  return h;
}

function patPrev(){var d=pd(patViewDate);d.setDate(d.getDate()-1);patViewDate=fd(d);render();}
function patNext(){var d=pd(patViewDate);d.setDate(d.getDate()+1);patViewDate=fd(d);render();}
function patJump(dateStr){if(dateStr){patViewDate=dateStr;render();}}

/* CHARGE NURSE */
var CHARGE_FIELDS=[
  {id:"admissions",label:"Total admission / trans-in",placeholder:"0"},
  {id:"discharges",label:"Total discharges / trans-out",placeholder:"0"},
  {id:"deaths",label:"Total deaths",placeholder:"0"},
  {id:"mpox",label:"MPOX report",placeholder:"Enter MPOX details"},
  {id:"responsible",label:"Total reportable case",placeholder:"0"}
];
var chargeViewDate=fd(new Date());

function chargeNav(dir){
  var d=pd(chargeViewDate);
  d.setDate(d.getDate()+dir);
  chargeViewDate=fd(d);render();
}
function chargeJump(v){if(v){chargeViewDate=v;render();}}

function saveChargeField(field){
  var el=document.getElementById("ch-"+field);
  if(!el)return;
  if(!S.charge[chargeViewDate])S.charge[chargeViewDate]={};
  S.charge[chargeViewDate][field]=el.value;
  save();
}

function clearChargeDay(){
  if(!confirm("Clear all charge nurse data for this day?"))return;
  delete S.charge[chargeViewDate];
  save();render();
}

function renderCharge(){
  var today=fd(new Date());
  var dobj=pd(chargeViewDate);
  var isToday=chargeViewDate===today;
  var data=S.charge[chargeViewDate]||{};

  var h='<div class="mnav"><button onclick="chargeNav(-1)">&#8249;</button><span class="mlbl">'+dobj.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric",year:"numeric"})+'</span><button onclick="chargeNav(1)">&#8250;</button></div>';

  h+='<div class="pat-datepick">';
  h+='<input class="finp pat-dateinp" type="date" value="'+chargeViewDate+'" onchange="chargeJump(this.value)" style="margin-bottom:0;flex:1">';
  if(!isToday)h+='<button class="pat-today-btn" onclick="chargeJump(\''+today+'\')">Today</button>';
  h+='</div>';

  h+='<div class="ch-card">';
  h+='<div class="ch-card-title">Charge nurse daily log</div>';

  for(var i=0;i<CHARGE_FIELDS.length;i++){
    var f=CHARGE_FIELDS[i];
    var val=data[f.id]||"";
    var isNum=(f.id!=="mpox");

    h+='<div class="ch-field">';
    h+='<label class="ch-flbl">'+f.label+'</label>';
    if(f.id==="mpox"){
      h+='<textarea class="finp ch-inp" id="ch-'+f.id+'" placeholder="'+f.placeholder+'" onblur="saveChargeField(\''+f.id+'\')">'+esc(val)+'</textarea>';
    }else{
      h+='<div class="ch-num-row">';
      h+='<button class="ch-minus" onclick="chargeStep(\''+f.id+'\',-1)">-</button>';
      h+='<input class="finp ch-inp ch-num" id="ch-'+f.id+'" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="'+f.placeholder+'" value="'+esc(val)+'" onblur="saveChargeField(\''+f.id+'\')">';
      h+='<button class="ch-plus" onclick="chargeStep(\''+f.id+'\',1)">+</button>';
      h+='</div>';
    }
    h+='</div>';
  }

  var hasData=false;
  for(var k in data){if(data[k])hasData=true;}
  if(hasData){
    h+='<button class="ch-clear" onclick="clearChargeDay()">Clear this day</button>';
  }
  h+='</div>';

  return h;
}

function chargeStep(field,dir){
  var el=document.getElementById("ch-"+field);
  if(!el)return;
  var val=parseInt(el.value)||0;
  val+=dir;
  if(val<0)val=0;
  el.value=val;
  saveChargeField(field);
}

/* REPORTS */
var rptYear=new Date().getFullYear();
var rptMonth=new Date().getMonth();

function rptPm(){rptMonth--;if(rptMonth<0){rptMonth=11;rptYear--;}render();}
function rptNm(){rptMonth++;if(rptMonth>11){rptMonth=0;rptYear++;}render();}

function getMonthData(){
  var y=rptYear,m=rptMonth,tot=dim(y,m);
  var days=[];
  for(var d=1;d<=tot;d++){
    var ds2=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    days.push({ds:ds2,dt:pd(ds2),dd:gdd(ds2),logs:S.logs[ds2]||[],pats:S.patients[ds2]||[],ch:S.charge[ds2]||{}});
  }
  return{y:y,m:m,tot:tot,days:days};
}

function renderReports(){
  var md=getMonthData();
  var h='<div class="rpt-month"><button onclick="rptPm()">&#8249;</button><span class="mlbl">'+MO[md.m]+" "+md.y+'</span><button onclick="rptNm()">&#8250;</button></div>';

  /* 1. TIME RECORD SUMMARY */
  var totalShifts=0,daysWorked=0,daysOff=0,daysVL=0,daysSL=0;
  for(var i=0;i<md.days.length;i++){
    var dy=md.days[i];
    totalShifts+=dy.dd.shifts.length;
    if(dy.logs.length>0)daysWorked++;
    if(dy.dd.tags.indexOf("OFF")>=0)daysOff++;
    if(dy.dd.tags.indexOf("LV")>=0)daysVL++;
    if(dy.dd.tags.indexOf("SL")>=0)daysSL++;
  }

  h+='<div class="rpt-section">';
  h+='<div class="rpt-title">Daily time record</div>';
  h+='<div class="rpt-desc">Shift schedules and login/logout for '+MO[md.m]+'</div>';
  h+='<div class="rpt-stat">';
  h+='<div class="rpt-stat-item"><div class="rpt-stat-label">Shifts</div><div class="rpt-stat-val">'+totalShifts+'</div></div>';
  h+='<div class="rpt-stat-item"><div class="rpt-stat-label">Worked</div><div class="rpt-stat-val">'+daysWorked+'</div></div>';
  h+='<div class="rpt-stat-item"><div class="rpt-stat-label">Off</div><div class="rpt-stat-val">'+daysOff+'</div></div>';
  h+='<div class="rpt-stat-item"><div class="rpt-stat-label">VL</div><div class="rpt-stat-val">'+daysVL+'</div></div>';
  h+='<div class="rpt-stat-item"><div class="rpt-stat-label">SL</div><div class="rpt-stat-val">'+daysSL+'</div></div>';
  h+='</div>';
  h+='<button class="xbtn" onclick="exportTimeRecord()">Export time record (.xlsx)</button>';
  h+='</div>';

  /* 2. ACCOMPLISHMENT REPORT */
  var totalPats=0;
  var checkTotals={};
  for(var ci=0;ci<CHECKS.length;ci++)checkTotals[CHECKS[ci].id]=0;
  for(var i=0;i<md.days.length;i++){
    var pats=md.days[i].pats;
    totalPats+=pats.length;
    for(var pi=0;pi<pats.length;pi++){
      var p=pats[pi];
      for(var ci=0;ci<CHECKS.length;ci++){
        var ck=CHECKS[ci];
        if(!p.checks||p.checks[ck.id]!==false)checkTotals[ck.id]++;
      }
    }
  }

  h+='<div class="rpt-section">';
  h+='<div class="rpt-title">Accomplishment report</div>';
  h+='<div class="rpt-desc">Nursing tasks performed for '+MO[md.m]+' ('+totalPats+' total patients)</div>';
  h+='<div class="rpt-card">';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["endorsement"]+'</div><div class="rpt-check-txt">Attended endorsements</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["admitted"]+'</div><div class="rpt-check-txt">Admitted patients within the shift</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["attended"]+'</div><div class="rpt-check-txt">Attended and assisted patients with their needs and rendered immediate nursing interventions</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["medications"]+'</div><div class="rpt-check-txt">Administered medications as prescribed by the physician on duty</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["orders"]+'</div><div class="rpt-check-txt">Carried out doctor\'s orders with proper documentation</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["documented"]+'</div><div class="rpt-check-txt">Completely documented patient cares done during the shift</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["teachings"]+'</div><div class="rpt-check-txt">Provided health teachings to patients and/or watchers</div></div>';
  h+='<div class="rpt-check-row"><div class="rpt-check-num">'+checkTotals["discharge"]+'</div><div class="rpt-check-txt">Provided complete health instructions of discharged patients</div></div>';
  h+='</div>';
  h+='<button class="xbtn" onclick="exportAccomplishment()">Export accomplishment report (.xlsx)</button>';
  h+='</div>';

  /* 3. CHARGE NURSE SUMMARY */
  var chTotals={admissions:0,discharges:0,deaths:0,responsible:0};
  var chDaysWithData=0;
  var mpoxEntries=[];
  for(var i=0;i<md.days.length;i++){
    var ch=md.days[i].ch;
    var hasAny=false;
    if(parseInt(ch.admissions)||0){chTotals.admissions+=parseInt(ch.admissions);hasAny=true;}
    if(parseInt(ch.discharges)||0){chTotals.discharges+=parseInt(ch.discharges);hasAny=true;}
    if(parseInt(ch.deaths)||0){chTotals.deaths+=parseInt(ch.deaths);hasAny=true;}
    if(parseInt(ch.responsible)||0){chTotals.responsible+=parseInt(ch.responsible);hasAny=true;}
    if(ch.mpox){mpoxEntries.push({date:md.days[i].ds,text:ch.mpox});hasAny=true;}
    if(hasAny)chDaysWithData++;
  }

  h+='<div class="rpt-section">';
  h+='<div class="rpt-title">Charge nurse summary</div>';
  h+='<div class="rpt-desc">Daily census totals for '+MO[md.m]+' ('+chDaysWithData+' days with data)</div>';
  h+='<div class="rpt-card">';
  h+='<div class="rpt-row"><span class="rpt-row-label">Total admission / trans-in</span><span class="rpt-row-val">'+chTotals.admissions+'</span></div>';
  h+='<div class="rpt-row"><span class="rpt-row-label">Total discharges / trans-out</span><span class="rpt-row-val">'+chTotals.discharges+'</span></div>';
  h+='<div class="rpt-row"><span class="rpt-row-label">Total deaths</span><span class="rpt-row-val">'+chTotals.deaths+'</span></div>';
  h+='<div class="rpt-row"><span class="rpt-row-label">Total reportable case</span><span class="rpt-row-val">'+chTotals.responsible+'</span></div>';
  if(mpoxEntries.length>0){
    h+='<div class="rpt-row"><span class="rpt-row-label">MPOX reports</span><span class="rpt-row-val">'+mpoxEntries.length+'</span></div>';
  }
  h+='</div>';
  h+='<button class="xbtn" onclick="exportCharge()">Export charge nurse report (.xlsx)</button>';
  h+='</div>';

  h+='<button class="xbtn" style="background:var(--blue);margin-top:16px" onclick="exportAll()">Export all reports (.xlsx)</button>';

  return h;
}

/* EXPORT FUNCTIONS */
function xlsxReady(){
  if(typeof XLSX==="undefined"){alert("Excel library is still loading. Please try again in a few seconds.");return false;}
  return true;
}

function buildTimeRecordSheet(md){
  var rows=[];
  var totalShifts=0;
  for(var i=0;i<md.days.length;i++){
    var dy=md.days[i];
    var dn=DAYS[dy.dt.getDay()];
    var parts=[];for(var j=0;j<dy.dd.all.length;j++){var it=gi(dy.dd.all[j]);if(it)parts.push(it.short);}
    var schStr=parts.join(", ");
    var shiftCount=dy.dd.shifts.length;
    totalShifts+=shiftCount;
    var tp=[];for(var j=0;j<dy.dd.tags.length;j++){var it=gi(dy.dd.tags[j]);if(it)tp.push(it.short);}
    var stStr=tp.join(", ");
    var swap=S.swaps[dy.ds];var swStr="";
    if(swap){var swSh=gi(swap.shift);swStr="Swap with: "+swap.nurse;if(swap.date)swStr+=", New: "+swap.date;if(swSh)swStr+=" ("+swSh.short+")";if(swap.notes)swStr+=", "+swap.notes;}
    if(dy.logs.length===0){
      rows.push({Date:dy.ds,Day:dn,Schedule:schStr,Login:"",Logout:"",Status:stStr,"Swap Details":swStr});
    }else{
      for(var li=0;li<dy.logs.length;li++){
        var l=dy.logs[li],iT=new Date(l.lt),oT=l.lo?new Date(l.lo):null;
        rows.push({Date:li===0?dy.ds:"",Day:li===0?dn:"",Schedule:li===0?schStr:"",
          Login:iT.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:true}),
          Logout:oT?oT.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:true}):"(active)",
          Status:li===0?stStr:"","Swap Details":li===0?swStr:""});
      }
    }
  }
  rows.push({Date:"",Day:"",Schedule:"",Login:"",Logout:"",Status:"",  "Swap Details":""});
  rows.push({Date:"TOTAL SHIFTS",Day:"",Schedule:totalShifts,Login:"",Logout:"",Status:"","Swap Details":""});
  var ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:6},{wch:24},{wch:12},{wch:12},{wch:14},{wch:40}];
  return ws;
}

function buildAccomplishmentSheet(md){
  var patRows=[];
  for(var i=0;i<md.days.length;i++){
    var dy=md.days[i];var dn=DAYS[dy.dt.getDay()];
    for(var pi=0;pi<dy.pats.length;pi++){
      var p=dy.pats[pi];
      var row={Date:dy.ds,Day:dn,"Patient Name":p.name,"Procedure Done":p.procedure,"Final Diagnosis":p.diagnosis,"Referring Doctor":p.doctor};
      for(var ci=0;ci<CHECKS.length;ci++){
        var ck=CHECKS[ci];
        row[ck.label]=(!p.checks||p.checks[ck.id]!==false)?"Yes":"No";
      }
      row["MCOD"]=p.mcod||"";
      row["Additional Notes"]=p.notes||"";
      patRows.push(row);
    }
  }
  /* Summary rows */
  if(patRows.length>0){
    var totalPatCount=patRows.length;
    patRows.push({Date:"",Day:"","Patient Name":"","Procedure Done":"","Final Diagnosis":"","Referring Doctor":""});
    var sumRow={Date:"SUMMARY",Day:"","Patient Name":"Total patients: "+totalPatCount,"Procedure Done":"","Final Diagnosis":"","Referring Doctor":""};
    for(var ci=0;ci<CHECKS.length;ci++){
      var ck=CHECKS[ci];
      var count=0;
      for(var r=0;r<patRows.length-1;r++){if(patRows[r][ck.label]==="Yes")count++;}
      sumRow[ck.label]=count;
    }
    sumRow["MCOD"]="";sumRow["Additional Notes"]="";
    patRows.push(sumRow);
  }
  var ws=XLSX.utils.json_to_sheet(patRows);
  var cols=[{wch:12},{wch:6},{wch:24},{wch:28},{wch:28},{wch:22}];
  for(var ci=0;ci<CHECKS.length;ci++)cols.push({wch:18});
  cols.push({wch:20});cols.push({wch:30});
  ws["!cols"]=cols;
  return ws;
}

function buildChargeSheet(md){
  var rows=[];
  for(var i=0;i<md.days.length;i++){
    var dy=md.days[i];var dn=DAYS[dy.dt.getDay()];var ch=dy.ch;
    var hasAny=(ch.admissions||ch.discharges||ch.deaths||ch.mpox||ch.responsible);
    if(hasAny){
      rows.push({Date:dy.ds,Day:dn,"Admissions/Trans-In":ch.admissions||0,"Discharges/Trans-Out":ch.discharges||0,"Deaths":ch.deaths||0,"MPOX Report":ch.mpox||"","Reportable Case":ch.responsible||0});
    }
  }
  if(rows.length>0){
    var totA=0,totD=0,totDe=0,totR=0;
    for(var i=0;i<rows.length;i++){
      totA+=parseInt(rows[i]["Admissions/Trans-In"])||0;
      totD+=parseInt(rows[i]["Discharges/Trans-Out"])||0;
      totDe+=parseInt(rows[i]["Deaths"])||0;
      totR+=parseInt(rows[i]["Reportable Case"])||0;
    }
    rows.push({Date:"",Day:"","Admissions/Trans-In":"","Discharges/Trans-Out":"","Deaths":"","MPOX Report":"","Reportable Case":""});
    rows.push({Date:"TOTAL",Day:"","Admissions/Trans-In":totA,"Discharges/Trans-Out":totD,"Deaths":totDe,"MPOX Report":"","Reportable Case":totR});
  }
  var ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:6},{wch:20},{wch:22},{wch:10},{wch:30},{wch:18}];
  return ws;
}
